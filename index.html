<title>Humanizador</title>
<style>
  :root { --bg:#0e0e12; --card:#17171f; --line:#26262f; --txt:#e8e8ef; --sub:#8a8a99; --ok:#3ecf8e; --err:#ff5c7a; --warn:#ffb84d; --acc:#7c6cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:520px; }
  h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--sub); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  textarea, input, select { width:100%; background:#0f0f14; border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:10px 12px; font-size:14px; font-family:inherit; outline:none; }
  textarea { resize:vertical; min-height:70px; }
  input:focus, textarea:focus, select:focus { border-color:var(--acc); }
  button { width:100%; padding:12px; border:none; border-radius:8px; background:var(--acc); color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-top:14px; transition:.15s; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:not(:disabled):hover { filter:brightness(1.1); }
  #log { font-family:'Cascadia Code',Consolas,monospace; font-size:12.5px; line-height:1.7; max-height:340px; overflow-y:auto; padding:12px; background:#0a0a0e; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; word-break:break-word; }
  #log:empty::before { content:'aguardando…'; color:var(--sub); }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); } .acc { color:var(--acc); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Humanizador</h1>
  <div class="sub">token → profile sorteado + foto sorteada + hypesquad</div>

  <div class="card">
    <label>Tokens (um por linha)</label>
    <textarea id="tokens" placeholder="MTIz...&#10;MTIz..."></textarea>

    <label style="margin-top:12px">HypeSquad</label>
    <select id="hypesquad">
      <option value="0">nenhum</option>
      <option value="1">1 — Bravery</option>
      <option value="2">2 — Brilliance</option>
      <option value="3">3 — Balance</option>
    </select>

    <button id="go">Humanizar</button>
  </div>

  <div class="card">
    <label>Status</label>
    <div id="log"></div>
  </div>
</div>

const API = "https://discord.com/api/v10";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const log = (msg, cls="") => {
  const el = $("log");
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
};

const headers = token => ({
  "Authorization": token,
  "Content-Type": "application/json",
  "User-Agent": "Mozilla/5.0"
});

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function carregarFotosDoGitHub() {
  const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const arquivos = await r.json();
    const imagens = arquivos.filter(f => f.name.match(/\.(png|jpe?g|webp)$/i));
    
    PHOTOS = imagens.map(img => 
      `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${img.name}`
    );
    log(`carregadas ${PHOTOS.length} fotos do repositório`, "ok");
  } catch (e) {
    log(`erro ao buscar fotos no GitHub: ${e.message}`, "err");
  }
}

async function patchUser(token, payload) {
  const r = await fetch(`${API}/users/@me`, { method:"PATCH", headers:headers(token), body:JSON.stringify(payload) });
  return { ok: r.status, body: await r.text() };
}

async function patchProfile(token, payload) {
  const r = await fetch(`${API}/users/@me/profile`, { method:"PATCH", headers:headers(token), body:JSON.stringify(payload) });
  return { ok: r.status, body: await r.text() };
}

async function patchAvatarFromURL(token, url) {
  if (!url) return { ok: 0, body: "sem foto" };
  const blob = await fetch(url).then(r => r.blob());
  const b64 = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
  const r = await fetch(`${API}/users/@me`, { method:"PATCH", headers:headers(token), body:JSON.stringify({ avatar: b64 }) });
  return { ok: r.status, body: await r.text() };
}

async function postHypesquad(token, house) {
  const r = await fetch(`${API}/hypesquad/online`, { method:"POST", headers:headers(token), body:JSON.stringify({ house_id: house }) });
  return { ok: r.status, body: await r.text() };
}

async function setUsernameWithFallback(token, display, username) {
  let r = await patchUser(token, { global_name: display, username });
  if (r.ok === 200) return { ...r, used: username };

  log(`  username ocupado, tentando reserva…`, "warn");
  for (let i = 0; i < 5; i++) {
    const candidate = `${username}${Math.floor(100 + Math.random() * 9900)}`;
    r = await patchUser(token, { global_name: display, username: candidate });
    if (r.ok === 200) return { ...r, used: candidate };
    await sleep(1200);
  }
  return { ...r, used: null };
}

async function humanize(token, profile, photo, hypesquad) {
  const short = token.slice(0, 8) + "…" + token.slice(-4);

  const nm = await setUsernameWithFallback(token, profile.display, profile.username);
  log(`  nome: ${nm.ok}${nm.used ? " → " + nm.used : ""}`, nm.ok === 200 ? "ok" : "err");

  if (photo) {
    const av = await patchAvatarFromURL(token, photo).catch(e => ({ ok: 0, body: String(e) }));
    log(`  avatar: ${av.ok}`, av.ok === 200 ? "ok" : "err");
    await sleep(900);
  }

  const prof = await patchProfile(token, { bio: profile.bio, pronouns: profile.pronouns });
  log(`  bio/pronouns: ${prof.ok}`, (prof.ok === 200 || prof.ok === 204) ? "ok" : "err");
  await sleep(900);

  if (hypesquad > 0) {
    const hs = await postHypesquad(token, hypesquad);
    log(`  hypesquad: ${hs.ok}`, (hs.ok === 200 || hs.ok === 204) ? "ok" : "warn");
    await sleep(900);
  }

  log(`  ✓ ${short}`, "ok");
}

$("go").addEventListener("click", async () => {
  const tokens = $("tokens").value.split("\n").map(t => t.trim()).filter(Boolean);
  if (!tokens.length) return log("sem token", "err");
  
  $("go").disabled = true;
  $("log").innerHTML = "";

  if (PHOTOS.length === 0) {
    log(`buscando fotos no GitHub…`, "acc");
    await carregarFotosDoGitHub();
    if (PHOTOS.length === 0) {
      log(`nenhuma foto encontrada. o repo é público?`, "err");
      $("go").disabled = false;
      return;
    }
  }

  const hypesquad = parseInt($("hypesquad").value) || 0;
  const pool = shuffle(PROFILES);
  const photos = shuffle(PHOTOS);

  log(`iniciando ${tokens.length} conta(s), ${photos.length} foto(s), ${pool.length} profiles…`, "acc");

  for (let i = 0; i < tokens.length; i++) {
    log(`\n[${i+1}/${tokens.length}]`, "acc");
    const profile = pool[i % pool.length];
    const photo = photos.length ? photos[i % photos.length] : null;
    try { await humanize(tokens[i], profile, photo, hypesquad); }
    catch (e) { log(`  erro: ${e.message}`, "err"); }
    if (i < tokens.length - 1) await sleep(1500);
  }

  log(`\nfinalizado.`, "acc");
  $("go").disabled = false;
});
</script>
